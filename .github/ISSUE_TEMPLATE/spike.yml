name: Spike
description: A time-boxed question to answer before building
labels: ['type:spike']
body:
  - type: textarea
    id: question
    attributes:
      label: Question
      description: What do we need to find out?
    validations:
      required: true
  - type: input
    id: time-box
    attributes:
      label: Time box
      description: For example 1 hour
    validations:
      required: true
  - type: textarea
    id: decision
    attributes:
      label: Decision
      description: Fill in when the spike is done.
    validations:
      required: false
