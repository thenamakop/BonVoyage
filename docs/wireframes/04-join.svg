<svg xmlns="http://www.w3.org/2000/svg" width="360" height="780" viewBox="0 0 360 780"><title>Join a trip</title><desc>Invitation landing screen with signed-out and expired-link insets</desc><rect width="360" height="780" fill="#F3F4F6"/><rect x="16" y="80" width="328" height="300" rx="10" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1"/><text x="32" y="122" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="18" fill="#111827" font-weight="bold" text-anchor="start">Long weekend in the hills</text><text x="32" y="148" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" fill="#111827" font-weight="normal" text-anchor="start">Asha invited you</text><text x="32" y="172" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#6B7280" font-weight="normal" text-anchor="start">3 of 8 members</text><rect x="32" y="192" width="296" height="56" rx="8" fill="#F3F4F6" stroke="none" stroke-width="1"/><text x="44" y="216" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#111827" font-weight="normal" text-anchor="start">Your answers are visible only to you;</text><text x="44" y="234" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#111827" font-weight="normal" text-anchor="start">the group sees totals.</text><rect x="32" y="268" width="296" height="44" rx="8" fill="#F4A340" stroke="none" stroke-width="1"/><text x="180" y="294.5" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" fill="#111827" font-weight="bold" text-anchor="middle">Join the trip</text><rect x="16" y="410" width="328" height="150" rx="8" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="1" stroke-dasharray="5 4"/><text x="26" y="428" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#6B7280" font-weight="bold" text-anchor="start">Signed out (annotation 1)</text><text x="32" y="452" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#111827" font-weight="normal" text-anchor="start">Sign in to join — you return here after</text><text x="32" y="470" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#111827" font-weight="normal" text-anchor="start">signing in.</text><rect x="32" y="492" width="200" height="44" rx="8" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1"/><text x="132" y="518.5" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" fill="#111827" font-weight="normal" text-anchor="middle">Sign in to join</text><circle cx="330" cy="424" r="10" fill="#C026D3"/><text x="330" y="428.5" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" fill="#FFFFFF" font-weight="bold" text-anchor="middle">1</text><rect x="16" y="580" width="328" height="120" rx="8" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="1" stroke-dasharray="5 4"/><text x="26" y="598" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#6B7280" font-weight="bold" text-anchor="start">Expired or closed link (annotation 2)</text><text x="32" y="622" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#111827" font-weight="normal" text-anchor="start">This invitation link has expired or</text><text x="32" y="640" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#111827" font-weight="normal" text-anchor="start">been revoked. Ask the organiser for</text><text x="32" y="658" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#111827" font-weight="normal" text-anchor="start">a new one.</text><circle cx="330" cy="594" r="10" fill="#C026D3"/><text x="330" y="598.5" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" fill="#FFFFFF" font-weight="bold" text-anchor="middle">2</text></svg>