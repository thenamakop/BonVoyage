ize="13" fill="#FFFFFF" font-weight="bold" text-anchor="middle">2</text><text x="24" y="700" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#6B7280" font-weight="normal" text-anchor="start">Updated 5 seconds ago</text></svg>