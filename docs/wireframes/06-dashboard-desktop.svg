<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800"><title>Trip dashboard (desktop)</title><desc>Two-column desktop dashboard: parameters and progress left, roster and organiser actions right</desc><rect width="1280" height="800" fill="#F3F4F6"/><rect x="0" y="0" width="1280" height="56" rx="0" fill="#0D3A3D" stroke="none" stroke-width="1"/><text x="24" y="36" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="18" fill="#FFFFFF" font-weight="bold" text-anchor="start">BonVoyage</text><circle cx="1240" cy="28" r="15" fill="#FFFFFF" stroke="#D1D5DB"/><text x="1240" y="33" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" fill="#111827" font-weight="bold" text-anchor="middle">A</text><text x="24" y="96" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="20" fill="#111827" font-weight="bold" text-anchor="start">Long weekend in the hills</text><rect x="24" y="116" width="600" height="56" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1"/><text x="44" y="142" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" fill="#111827" font-weight="bold" text-anchor="start">Waiting for preferences: 2 of 3 submitted</text><text x="44" y="162" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#111827" font-weight="normal" text-anchor="start">Everyone watches this page update live.</text><text x="24" y="194" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#6B7280" font-weight="normal" text-anchor="start">Step 2 of 7: Collecting preferences</text><rect x="24" y="216" width="600" height="240" rx="10" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1"/><text x="44" y="246" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" fill="#111827" font-weight="bold" text-anchor="start">Trip parameters</text><text x="44" y="2