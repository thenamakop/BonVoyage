="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" fill="#111827" font-weight="normal" text-anchor="start">Nights: 2 · Radius: 450 km</text><text x="44" y="306" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" fill="#111827" font-weight="normal" text-anchor="start">Group budget: ₹48,000 · about ₹16,000 each</text><circle cx="610" cy="300" r="10" fill="#C026D3"/><text x="610" y="304.5" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" fill="#FFFFFF" font-weight="bold" text-anchor="middle">1</text><rect x="44" y="330" width="556" height="16" rx="8" fill="#D1D5DB" stroke="none" stroke-width="1"/><rect x="44" y="330" width="370" height="16" rx="8" fill="#065F46" stroke="none" stroke-width="1"/><text x="44" y="364" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#6B7280" font-weight="normal" text-anchor="start">2 of 3 preferences submitted</text><rect x="660" y="200" width="596" height="240" rx="10" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1"/><rect x="684" y="230" width="548" height="40" rx="8" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1"/><text x="700" y="255" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" fill="#111827" font-weight="normal" text-anchor="start">Asha · Organiser</text><rect x="1150" y="239" width="75.4" height="22" rx="11" fill="#D1FAE5" stroke="none" stroke-width="1"/><text x="1158" y="254" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#065F46" font-weight="normal" text-anchor="start">Submitted</text><rect x="684" y="278" width="548" height="40" rx="8" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1"/><text x="700" y="303" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" fill="#111827" font-weight="normal" text-anchor="start">Rohan</text><rect x="1150" y="287" width="75.4" height="22" rx="11" fill="