ormal" text-anchor="start">Available to</text><rect x="204" y="560" width="140" height="44" rx="6" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1"/><text x="216" y="586" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" fill="#111827" font-weight="normal" text-anchor="start">8 Nov 2026</text><text x="32" y="640" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#6B7280" font-weight="normal" text-anchor="start">You can change this until the shortlist is made.</text><circle cx="330" cy="640" r="10" fill="#C026D3"/><text x="330" y="644.5" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" fill="#FFFFFF" font-weight="bold" text-anchor="middle">2</text><rect x="32" y="668" width="296" height="44" rx="8" fill="#F4A340" stroke="none" stroke-width="1"/><text x="180" y="694.5" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" fill="#111827" font-weight="bold" text-anchor="middle">Submit preferences</text></svg>