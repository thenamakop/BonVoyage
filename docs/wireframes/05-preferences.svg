xt-anchor="middle">Premium</text><text x="32" y="562" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#6B7280" font-weight="normal" text-anchor="start">Budget min (₹ per person)</text><rect x="32" y="566" width="140" height="44" rx="6" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1"/><text x="44" y="592" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" fill="#111827" font-weight="normal" text-anchor="start">8,000</text><text x="204" y="562" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#6B7280" font-weight="normal" text-anchor="start">Budget max (₹ per person)</text><rect x="204" y="566" width="140" height="44" rx="6" fill="#FFFFFF" stroke="#B91C1C" stroke-width="2"/><text x="216" y="592" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" fill="#111827" font-weight="normal" text-anchor="start">6,000</text><text x="208" y="626" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#B91C1C" font-weight="normal" text-anchor="start">Maximum must be at</text><text x="208" y="644" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#B91C1C" font-weight="normal" text-anchor="start">least the minimum.</text><circle cx="330" cy="566" r="10" fill="#C026D3"/><text x="330" y="570.5" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" fill="#FFFFFF" font-weight="bold" text-anchor="middle">1</text><text x="32" y="652" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#6B7280" font-weight="normal" text-anchor="start">Available from</text><rect x="32" y="656" width="140" height="44" rx="6" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1"/><text x="44" y="682" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" fill="#111827" font-weight="normal" text-anchor="start">6 Nov 2026</text><text x="204" y="652" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#6B7280" font-weight="normal" text-anchor="start">Available to</text><rect x="204" y="656" width="140" height="44" rx="6" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1"/><text x="216" y="682" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" fill="#111827" font-weight="normal" text-anchor="start">8 Nov 2026</text><text x="32" y="736" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#6B7280" font-weight="normal" text-anchor="start">You can change this until the shortlist is made.</text><circle cx="330" cy="736" r="10" fill="#C026D3"/><text x="330" y="740.5" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" fill="#FFFFFF" font-weight="bold" text-anchor="middle">2</text><rect x="32" y="764" width="296" height="44" rx="8" fill="#F4A340" stroke="none" stroke-width="1"/><text x="180" y="790.5" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" fill="#111827" font-weight="bold" text-anchor="middle">Submit preferences</text></svg>