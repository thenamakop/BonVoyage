<svg xmlns="http://www.w3.org/2000/svg" width="360" height="780" viewBox="0 0 360 780"><title>Empty shortlist diagnostic</title><desc>Diagnostic when fewer than three destinations fit, with suggested changes</desc><rect width="360" height="780" fill="#F3F4F6"/><rect x="0" y="0" width="360" height="52" rx="0" fill="#0D3A3D" stroke="none" stroke-width="1"/><text x="16" y="33" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="18" fill="#FFFFFF" font-weight="bold" text-anchor="start">BonVoyage</text><circle cx="330" cy="26" r="14" fill="#FFFFFF" stroke="#D1D5DB"/><text x="330" y="31" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" fill="#111827" font-weight="bold" text-anchor="middle">A</text><text x="16" y="86" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="18" fill="#111827" font-weight="bold" text-anchor="start">Shortlist</text><rect x="16" y="100" width="328" height="300" rx="10" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1"/><text x="32" y="140" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="16" fill="#111827" font-weight="bold" text-anchor="start">Only 1 destination fits</text><text x="32" y="168" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#111827" font-weight="normal" text-anchor="start">The budgets members share leave too little</text><text x="32" y="186" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#111827" font-weight="normal" text-anchor="start">for most places after travel and stay.</text><circle cx="330" cy="132" r="10" fill="#C026D3"/><text x="330" y="136.5" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" fill="#FFFFFF" font-weight="bold" text-anchor="middle">1</text><text x="32" y="232" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#6B7280" font-weight="normal" text-anchor="start">Try one of these changes:</text><rect x="32" y="248" width="296" height="44" rx="8" fill="#F4A340" stroke="none" stroke-width="1"/><text x="180" y="274.5" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" fill="#111827" font-weight="bold" text-anchor="middle">Widen the radius to 600 km</text><rect x="32" y="300" width="296" height="44" rx="8" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1"/><text x="180" y="326.5" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" fill="#111827" font-weight="normal" text-anchor="middle">Raise the group budget</text><rect x="32" y="352" width="296" height="44" rx="8" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1"/><text x="180" y="378.5" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" fill="#111827" font-weight="normal" text-anchor="middle">Change the dates</text><circle cx="330" cy="262" r="10" fill="#C026D3"/><text x="330" y="266.5" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" fill="#FFFFFF" font-weight="bold" text-anchor="middle">2</text></svg>