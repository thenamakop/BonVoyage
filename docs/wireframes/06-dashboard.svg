<svg xmlns="http://www.w3.org/2000/svg" width="360" height="780" viewBox="0 0 360 780"><title>Trip dashboard</title><desc>Live dashboard with status banner, roster, organiser actions and error inset</desc><rect width="360" height="780" fill="#F3F4F6"/><rect x="0" y="0" width="360" height="52" rx="0" fill="#0D3A3D" stroke="none" stroke-width="1"/><text x="16" y="33" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="18" fill="#FFFFFF" font-weight="bold" text-anchor="start">BonVoyage</text><circle cx="330" cy="26" r="14" fill="#FFFFFF" stroke="#D1D5DB"/><text x="330" y="31" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" fill="#111827" font-weight="bold" text-anchor="middle">A</text><text x="16" y="70" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="18" fill="#111827" font-weight="bold" text-anchor="start">Long weekend in the hills</text><rect x="16" y="84" width="328" height="52" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1"/><text x="32" y="106" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" fill="#111827" font-weight="bold" text-anchor="start">Waiting for preferences:</text><text x="32" y="124" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" fill="#111827" font-weight="normal" text-anchor="start">2 of 3 submitted</text><text x="32" y="162" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#6B7280" font-weight="normal" text-anchor="start">Gurugram · 2 nights · 450 km radius</text><text x="32" y="182" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#111827" font-weight="normal" text-anchor="start">Group budget ₹48,000 · about ₹16,000 each</text><circle cx="340" cy="176" r="10" fill="#C026D3"/><text x="340" y="180.5" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" fill="#FFFFFF" font-weight="bold" text-anchor="middle">3</text><rect x="16" y="200" width="328" height="16" rx="8" fill="#D1D5DB" stroke="none" stroke-width="1"/><rect x="16" y="200" width="219" height="16" rx="8" fill="#065F46" stroke="none" stroke-width="1"/><text x="32" y="234" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#6B7280" font-weight="normal" text-anchor="start">2 of 3 preferences submitted</text><circle cx="330" cy="208" r="10" fill="#C026D3"/><text x="330" y="212.5" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" fill="#FFFFFF" font-weight="bold" text-anchor="middle">1</text><rect x="16" y="252" width="328" height="40" rx="8" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1"/><text x="32" y="277" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" fill="#111827" font-weight="normal" text-anchor="start">Asha · Organiser</text><rect x="240" y="261" width="75.4" height="22" rx="11" fill="#D1FAE5" stroke="none" stroke-width="1"/><text x="248" y="276" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#065F46" font-weight="normal" text-anchor="start">Submitted</text><rect x="16" y="300" width="328" height="40" rx="8" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1"/><text x="32" y="325" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" fill="#111827" font-weight="normal" text-anchor="start">Rohan</text><rect x="240" y="309" width="75.4" height="22" rx="11" fill="#D1FAE5" stroke="none" stroke-width="1"/><text x="248" y="324" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#065F46" font-weight="normal" text-anchor="start">Submitted</text><rect x="16" y="348" width="328" height="40" rx="8" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1"/><text x="32" y="373" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" fill="#111827" font-weight="normal" text-anchor="start">Meera</text><rect x="240" y="357" width="62.199999999999996" height="22" rx="11" fill="#F3F4F6" stroke="none" stroke-width="1"/><text x="248" y="372" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#111827" font-weight="normal" text-anchor="start">Waiting</text><rect x="16" y="404" width="328" height="56" rx="8" fill="#E0F2FE" stroke="#0369A1" stroke-width="1"/><text x="32" y="426" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#111827" font-weight="normal" text-anchor="start">Next: once everyone answers, Asha can</text><text x="32" y="444" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#111827" font-weight="normal" text-anchor="start">make the shortlist.</text><rect x="16" y="480" width="160" height="44" rx="8" fill="#F4A340" stroke="none" stroke-width="1"/><text x="96" y="506.5" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" fill="#111827" font-weight="bold" text-anchor="middle">Copy invite link</text><rect x="188" y="480" width="156" height="44" rx="8" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1"/><text x="266" y="506.5" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" fill="#111827" font-weight="normal" text-anchor="middle">Cancel trip</text><rect x="16" y="536" width="328" height="44" rx="8" fill="#D1D5DB" stroke="none" stroke-width="1"/><text x="180" y="562.5" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" fill="#6B7280" font-weight="bold" text-anchor="middle">Close submissions</text><text x="32" y="598" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#6B7280" font-weight="normal" text-anchor="start">Available after 2 members submit.</text><circle cx="330" cy="558" r="10" fill="#C026D3"/><text x="330" y="562.5" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" fill="#FFFFFF" font-weight="bold" text-anchor="middle">2</text><text x="32" y="626" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#6B7280" font-weight="normal" text-anchor="start">Updated 5 seconds ago</text><rect x="16" y="642" width="328" height="76" rx="8" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="1" stroke-dasharray="5 4"/><text x="26" y="660" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#6B7280" font-weight="bold" text-anchor="start">Error state (annotation 4)</text><rect x="32" y="668" width="200" height="30" rx="6" fill="#FDE8E8" stroke="#B91C1C" stroke-width="1"/><text x="40" y="687" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#B91C1C" font-weight="normal" text-anchor="start">Could not update.</text><rect x="244" y="666" width="80" height="32" rx="8" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1"/><text x="284" y="686.5" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" fill="#111827" font-weight="normal" text-anchor="middle">Retry</text><circle cx="330" cy="654" r="10" fill="#C026D3"/><text x="330" y="658.5" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" fill="#FFFFFF" font-weight="bold" text-anchor="middle">4</text></svg>