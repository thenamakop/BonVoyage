em-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="15" fill="#111827" font-weight="bold" text-anchor="start">3. Nainital</text><text x="32" y="498" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#6B7280" font-weight="normal" text-anchor="start">310 km · curated road distance</text><text x="32" y="516" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#111827" font-weight="normal" text-anchor="start">₹15,600 group · ₹3,900 each · estimate</text><text x="32" y="536" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#065F46" font-weight="normal" text-anchor="start">Group spread is wide (4 to 9)</text><text x="40" y="554" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#6B7280" font-weight="normal" text-anchor="start">· Lake and boating</text><rect x="228" y="560" width="100" height="40" rx="8" fill="#F4A340" stroke="none" stroke-width="1"/><text x="278" y="584.5" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" fill="#111827" font-weight="bold" text-anchor="middle">Choose</text><circle cx="330" cy="106" r="10" fill="#C026D3"/><text x="330" y="110.5" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" fill="#FFFFFF" font-weight="bold" text-anchor="middle">1</text><circle cx="330" cy="166" r="10" fill="#C026D3"/><text x="330" y="170.5" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" fill="#FFFFFF" font-weight="bold" text-anchor="middle">2</text><circle cx="330" cy="294" r="10" fill="#C026D3"/><text x="330" y="298.5" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" fill="#FFFFFF" font-weight="bold" text-anchor="middle">3</text></svg>