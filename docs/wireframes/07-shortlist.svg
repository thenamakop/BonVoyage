<svg xmlns="http://www.w3.org/2000/svg" width="360" height="780" viewBox="0 0 360 780"><title>Ranked destination shortlist</title><desc>Ranked destination cards with provenance, estimate and group-fit explanation</desc><rect width="360" height="780" fill="#F3F4F6"/><rect x="0" y="0" width="360" height="52" rx="0" fill="#0D3A3D" stroke="none" stroke-width="1"/><text x="16" y="33" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="18" fill="#FFFFFF" font-weight="bold" text-anchor="start">BonVoyage</text><circle cx="330" cy="26" r="14" fill="#FFFFFF" stroke="#D1D5DB"/><text x="330" y="31" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" fill="#111827" font-weight="bold" text-anchor="middle">A</text><text x="16" y="70" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="18" fill="#111827" font-weight="bold" text-anchor="start">Shortlist</text><rect x="16" y="92" width="328" height="176" rx="10" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1"/><text x="32" y="118" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="15" fill="#111827" font-weight="bold" text-anchor="start">1. Rishikesh</text><text x="32" y="140" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#6B7280" font-weight="normal" text-anchor="start">250 km · curated road distance</text><text x="32" y="158" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#111827" font-weight="normal" text-anchor="start">₹12,800 group · ₹3,200 each · estimate</text><text x="32" y="178" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#065F46" font-weight="normal" text-anchor="start">Everyone rates this at least 6 out of 10</text><text x="40" y="196" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#6B7280" font-weight="normal" text-anchor="start">· F