<svg xmlns="http://www.w3.org/2000/svg" width="360" height="780" viewBox="0 0 360 780"><title>Sign in and sign up</title><desc>Mobile wireframe of the sign-in form with error slot and sign-up variant annotations</desc><rect width="360" height="780" fill="#F3F4F6"/><rect x="16" y="60" width="328" height="360" rx="10" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1"/><text x="32" y="108" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="20" fill="#111827" font-weight="bold" text-anchor="start">BonVoyage</text><text x="32" y="128" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#6B7280" font-weight="normal" text-anchor="start">Plan a trip your whole group agrees on.</text><rect x="32" y="144" width="296" height="34" rx="6" fill="#FDE8E8" stroke="#B91C1C" stroke-width="1"/><text x="44" y="166" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#B91C1C" font-weight="normal" text-anchor="start">Error alert slot: “Invalid email or password.”</text><circle cx="320" cy="161" r="10" fill="#C026D3"/><text x="320" y="165.5" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" fill="#FFFFFF" font-weight="bold" text-anchor="middle">1</text><text x="32" y="204" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#6B7280" font-weight="normal" text-anchor="start">Email</text><rect x="32" y="208" width="296" height="44" rx="6" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1"/><text x="44" y="234" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" fill="#111827" font-weight="normal" text-anchor="start">asha@demo.bonvoyage.test</text><text x="32" y="278" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#6B7280" font-weight="normal" text-anchor="start">Password</text><rect x="32" y="282" width="296" height="44" rx="6" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1"/><text x="44" y="308" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" fill="#111827" font-weight="normal" text-anchor="start">••••••••••••</text><rect x="32" y="340" width="296" height="44" rx="8" fill="#F4A340" stroke="none" stroke-width="1"/><text x="180" y="366.5" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" fill="#111827" font-weight="bold" text-anchor="middle">Sign in</text><text x="180" y="404" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#6B7280" font-weight="normal" text-anchor="middle">New here? Create an account</text><rect x="16" y="440" width="328" height="190" rx="8" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="1" stroke-dasharray="5 4"/><text x="26" y="458" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#6B7280" font-weight="bold" text-anchor="start">Sign-up adds (annotation 2)</text><text x="32" y="478" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#111827" font-weight="normal" text-anchor="start">Name field above email.</text><text x="32" y="500" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#111827" font-weight="normal" text-anchor="start">Password hint: “At least 12 characters”.</text><text x="32" y="532" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#6B7280" font-weight="normal" text-anchor="start">Name</text><rect x="32" y="536" width="296" height="44" rx="6" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1"/><text x="44" y="562" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" fill="#111827" font-weight="normal" text-anchor="start">Asha</text><circle cx="320" cy="462" r="10" fill="#C026D3"/><text x="320" y="466.5" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" fill="#FFFFFF" font-weight="bold" text-anchor="middle">2</text></svg>