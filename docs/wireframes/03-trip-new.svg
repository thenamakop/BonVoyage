<svg xmlns="http://www.w3.org/2000/svg" width="360" height="780" viewBox="0 0 360 780"><title>Create a trip</title><desc>Trip creation form with helpers and one field in its error state</desc><rect width="360" height="780" fill="#F3F4F6"/><rect x="0" y="0" width="360" height="52" rx="0" fill="#0D3A3D" stroke="none" stroke-width="1"/><text x="16" y="33" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="18" fill="#FFFFFF" font-weight="bold" text-anchor="start">BonVoyage</text><circle cx="330" cy="26" r="14" fill="#FFFFFF" stroke="#D1D5DB"/><text x="330" y="31" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" fill="#111827" font-weight="bold" text-anchor="middle">A</text><text x="16" y="86" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="18" fill="#111827" font-weight="bold" text-anchor="start">New trip</text><text x="32" y="144" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#6B7280" font-weight="normal" text-anchor="start">Trip title</text><rect x="32" y="148" width="296" height="44" rx="6" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1"/><text x="44" y="174" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" fill="#111827" font-weight="normal" text-anchor="start">Long weekend in the hills</text><text x="32" y="244" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#6B7280" font-weight="normal" text-anchor="start">Starting city</text><rect x="32" y="248" width="296" height="44" rx="6" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1"/><text x="44" y="274" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" fill="#111827" font-weight="normal" text-anchor="start">Gurugram</text><text x="32" y="344" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#6B7280" font-weight="normal" text-anchor="start">Nights (1 to 14)</text><rect x="32" y="348" width="296" height="44" rx="6" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1"/><text x="44" y="374" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" fill="#111827" font-weight="normal" text-anchor="start">2</text><text x="32" y="444" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#6B7280" font-weight="normal" text-anchor="start">Group budget (₹)</text><rect x="32" y="448" width="296" height="44" rx="6" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1"/><text x="44" y="474" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" fill="#111827" font-weight="normal" text-anchor="start">48,000</text><text x="36" y="508" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#6B7280" font-weight="normal" text-anchor="start">Total for the whole group</text><text x="32" y="552" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#6B7280" font-weight="normal" text-anchor="start">Search radius (km)</text><rect x="32" y="556" width="296" height="44" rx="6" fill="#FFFFFF" stroke="#B91C1C" stroke-width="2"/><text x="44" y="582" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" fill="#111827" font-weight="normal" text-anchor="start">10</text><text x="36" y="616" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#B91C1C" font-weight="normal" text-anchor="start">⚠ Radius must be at least 50 km</text><text x="32" y="638" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#6B7280" font-weight="normal" text-anchor="start">How far from your starting city you are</text><text x="32" y="656" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#6B7280" font-weight="normal" text-anchor="start">willing to travel by road.</text><rect x="32" y="682" width="296" height="44" rx="8" fill="#F4A340" stroke="none" stroke-width="1"/><text x="180" y="708.5" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" fill="#111827" font-weight="bold" text-anchor="middle">Create trip</text><circle cx="330" cy="556" r="10" fill="#C026D3"/><text x="330" y="560.5" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" fill="#FFFFFF" font-weight="bold" text-anchor="middle">1</text><circle cx="330" cy="448" r="10" fill="#C026D3"/><text x="330" y="452.5" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" fill="#FFFFFF" font-weight="bold" text-anchor="middle">2</text></svg>