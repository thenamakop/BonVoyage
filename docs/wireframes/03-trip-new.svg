<svg xmlns="http://www.w3.org/2000/svg" width="360" height="780" viewBox="0 0 360 780"><title>Create a trip</title><desc>Trip creation form with helpers and one field in its error state</desc><rect width="360" height="780" fill="#F3F4F6"/><rect x="0" y="0" width="360" height="52" rx="0" fill="#0D3A3D" stroke="none" stroke-width="1"/><text x="16" y="33" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="18" fill="#FFFFFF" font-weight="bold" text-anchor="start">BonVoyage</text><circle cx="330" cy="26" r="14" fill="#FFFFFF" stroke="#D1D5DB"/><text x="330" y="31" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" fill="#111827" font-weight="bold" text-anchor="middle">A</text><text x="16" y="70" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="18" fill="#111827" font-weight="bold" text-anchor="start">New trip</text><text x="32" y="128" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#6B7280" font-weight="normal" text-anchor="start">Trip title</text><rect x="32" y="132" width="296" height="44" rx="6" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1"/><text x="44" y="158" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" fill="#111827" font-weight="normal" text-anchor="start">Long weekend in the hills</text><text x="32" y="228" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#6B7280" font-weight="normal" text-anchor="start">Origin hub</text><rect x="32" y="232" width="296" height="44" rx="6" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1"/><text x="44" y="258" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" fill="#111827" font-weight="normal" text-anchor="start">Gurugram</text><text x="32" y="328" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#6B7280" font-weight="normal" text-anchor="start">Nights (1 to 14)</text><rect x="32" y="332" width="296" height="44" rx="6" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1"/><text x="44" y="358" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" fill="#111827" font-weight="normal" text-anchor="start">2</text><text x="32" y="428" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#6B7280" font-weight="normal" text-anchor="start">Group budget (₹)</text><rect x="32" y="432" width="296" height="44" rx="6" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1"/><text x="44" y="458" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" fill="#111827" font-weight="normal" text-anchor="start">48,000</text><text x="36" y="492" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#6B7280" font-weight="normal" text-anchor="start">Total for the whole group</text><text x="32" y="536" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#6B7280" font-weight="normal" text-anchor="start">Search radius (km)</text><rect x="32" y="540" width="296" height="44" rx="6" fill="#FFFFFF" stroke="#B91C1C" stroke-width="2"/><text x="44" y="566" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" fill="#111827" font-weight="normal" text-anchor="start">10</text><text x="36" y="600" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#B91C1C" font-weight="normal" text-anchor="start">⚠ Radius must be at least 50 km</text><text x="32" y="612" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#6B7280" font-weight="normal" text-anchor="start">Distance is measured from the origin hub.</text><rect x="32" y="640" width="296" height="44" rx="8" fill="#F4A340" stroke="none" stroke-width="1"/><text x="180" y="666.5" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" fill="#111827" font-weight="bold" text-anchor="middle">Create trip</text><circle cx="330" cy="540" r="10" fill="#C026D3"/><text x="330" y="544.5" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" fill="#FFFFFF" font-weight="bold" text-anchor="middle">1</text><circle cx="330" cy="432" r="10" fill="#C026D3"/><text x="330" y="436.5" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" fill="#FFFFFF" font-weight="bold" text-anchor="middle">2</text></svg>